name: Guide Request
description: Request a build guide for a project that doesn't have one yet
labels: ["enhancement", "guide"]
body:
  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - Level 1 — Beginner Frontend
        - Level 2 — Intermediate Frontend
        - Level 3 — Backend Fundamentals
        - Level 4 — Fullstack MERN
        - Level 5 — Senior-Level Systems
    validations:
      required: true

  - type: input
    id: project
    attributes:
      label: Project name
      placeholder: e.g., IoT Dashboard
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why do you want this guide?
      placeholder: "e.g., I'm trying to build this project and I'm stuck on the architecture"
