<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" width="1280" height="200" role="img" aria-label="Roadmap: Level 1 through Level 5">
  <defs>
    <linearGradient id="roadmap-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0F"/>
      <stop offset="1" stop-color="#12131C"/>
    </linearGradient>
    <linearGradient id="roadmap-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ecc71"/>
      <stop offset="0.25" stop-color="#3498db"/>
      <stop offset="0.5" stop-color="#f1c40f"/>
      <stop offset="0.75" stop-color="#e67e22"/>
      <stop offset="1" stop-color="#e74c3c"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="200" fill="url(#roadmap-bg)" rx="6"/>
  <rect x="4" y="4" width="1272" height="192" fill="none" stroke="#4047E6" stroke-width="1" opacity="0.25" rx="4"/>

  <line x1="180" y1="80" x2="1100" y2="80" stroke="url(#roadmap-line)" stroke-width="3" opacity="0.35"/>

  <!-- Level 1 -->
  <circle cx="148" cy="80" r="32" fill="#0A0A0F" stroke="#2ecc71" stroke-width="2.5"/>
  <text x="148" y="75" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#2ecc71" text-anchor="middle">LVL</text>
  <text x="148" y="91" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2ecc71" text-anchor="middle">1</text>
  <text x="148" y="132" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F5F6FA" text-anchor="middle">JS Fundamentals</text>
  <text x="148" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8A8C99" text-anchor="middle">11 projects</text>
  <text x="148" y="167" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#2ecc71" text-anchor="middle">Complete</text>

  <!-- Arrow 1-2 -->
  <polygon points="265,74 277,80 265,86" fill="#8A8C99" opacity="0.5"/>

  <!-- Level 2 -->
  <circle cx="394" cy="80" r="32" fill="#0A0A0F" stroke="#3498db" stroke-width="2.5"/>
  <text x="394" y="75" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#3498db" text-anchor="middle">LVL</text>
  <text x="394" y="91" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#3498db" text-anchor="middle">2</text>
  <text x="394" y="132" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F5F6FA" text-anchor="middle">Frontend</text>
  <text x="394" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8A8C99" text-anchor="middle">16 projects</text>
  <text x="394" y="167" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#3498db" text-anchor="middle">Complete</text>

  <!-- Arrow 2-3 -->
  <polygon points="511,74 523,80 511,86" fill="#8A8C99" opacity="0.5"/>

  <!-- Level 3 -->
  <circle cx="640" cy="80" r="32" fill="#0A0A0F" stroke="#f1c40f" stroke-width="2.5"/>
  <text x="640" y="75" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f1c40f" text-anchor="middle">LVL</text>
  <text x="640" y="91" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f1c40f" text-anchor="middle">3</text>
  <text x="640" y="132" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F5F6FA" text-anchor="middle">Backend</text>
  <text x="640" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8A8C99" text-anchor="middle">17 projects</text>
  <text x="640" y="167" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#f1c40f" text-anchor="middle">Complete</text>

  <!-- Arrow 3-4 -->
  <polygon points="757,74 769,80 757,86" fill="#8A8C99" opacity="0.5"/>

  <!-- Level 4 -->
  <circle cx="886" cy="80" r="32" fill="#0A0A0F" stroke="#e67e22" stroke-width="2.5"/>
  <text x="886" y="75" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e67e22" text-anchor="middle">LVL</text>
  <text x="886" y="91" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e67e22" text-anchor="middle">4</text>
  <text x="886" y="132" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F5F6FA" text-anchor="middle">Fullstack MERN</text>
  <text x="886" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8A8C99" text-anchor="middle">18 projects</text>
  <text x="886" y="167" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#e67e22" text-anchor="middle">Complete</text>

  <!-- Arrow 4-5 -->
  <polygon points="1003,74 1015,80 1003,86" fill="#8A8C99" opacity="0.5"/>

  <!-- Level 5 -->
  <circle cx="1132" cy="80" r="32" fill="#0A0A0F" stroke="#e74c3c" stroke-width="2.5"/>
  <text x="1132" y="75" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#e74c3c" text-anchor="middle">LVL</text>
  <text x="1132" y="91" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e74c3c" text-anchor="middle">5</text>
  <text x="1132" y="132" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F5F6FA" text-anchor="middle">Senior Systems</text>
  <text x="1132" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8A8C99" text-anchor="middle">13 projects</text>
  <text x="1132" y="167" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#e74c3c" text-anchor="middle">In Progress</text>
</svg>
