<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Junior to Senior Web Projects">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0F"/>
      <stop offset="1" stop-color="#12131C"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- progression dots: junior (small) -> senior (large), brand accent -->
  <g fill="#4047E6">
    <circle cx="96"  cy="160" r="5"/>
    <circle cx="150" cy="160" r="8" opacity="0.85"/>
    <circle cx="210" cy="160" r="12" opacity="0.7"/>
    <circle cx="278" cy="160" r="17" opacity="0.55"/>
    <circle cx="356" cy="160" r="23" opacity="0.4"/>
  </g>
  <line x1="96" y1="160" x2="356" y2="160" stroke="#4047E6" stroke-width="1.5" opacity="0.25"/>

  <!-- title -->
  <text x="440" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#F5F6FA">
    Junior <tspan fill="#4047E6">→</tspan> Senior
  </text>
  <text x="440" y="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#4047E6">
    Web Projects
  </text>

  <!-- subtitle -->
  <text x="442" y="252" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8C99" letter-spacing="1.5">
    70+ PROJECTS · 5 LEVELS · GUIDES &amp; LIVE DEMOS
  </text>

  <!-- thin accent frame -->
  <rect x="8" y="8" width="1264" height="304" fill="none" stroke="#4047E6" stroke-width="1" opacity="0.3" rx="6"/>
</svg>
